# QQ Bot CF —— Cloudflare Workers 配置（模板）
#
# ⚠ 这个文件里【故意】没有 [[d1_databases]] 段。
#
# 为什么：wrangler deploy 会按配置文件整体覆盖 Worker 的绑定，所以 D1 必须声明；
# 但 database_id 是每个账号独有的，不能写进仓库。而 wrangler.toml 又不支持
# ${ENV_VAR} 插值（写了会被当成字面量发给 API，报 10021）。
#
# 做法：统一走 `npm run deploy`（scripts/deploy.mjs）。它会：
#   1. 查账号里有没有 qq-bot-db，有就复用，没有就创建（库 ID 缓存在 .wrangler/d1.json）
#   2. 以本文件为模板生成 .wrangler/deploy.toml，把 D1 绑定写进去
#   3. 用 `wrangler deploy --config .wrangler/deploy.toml` 部署
# 全程不需要手填任何 ID，绑定每次都在，库 ID 又不会进仓库。
#
# 直接跑 `npx wrangler deploy` 不会带 D1 绑定。连接 GitHub 部署请把
# 部署命令改成 `npm run deploy`。

name = "qq-bot-cf"
main = "src/worker.js"
# 运行时行为快照。取的是当前 wrangler（4.149.0）内置的最新稳定日期，
# 不能再往未来设：wrangler 会把超前于它认识的最新日期的值当作无效。
# 本项目没有依赖任何按兼容日期开关的 API，保持在这个值即可，不必跟着升级。
compatibility_date = "2026-10-06"

# ⚠ 密钥必须存成 Secret，不能存成普通变量（Text / Plain text）。
#
# Cloudflare 把「环境变量」和「Secret」分开处理：
#   - 普通变量（dashboard 里类型选 Text）：每次 wrangler deploy 都会按配置文件
#     整体覆盖，你在控制台手动加的会被清空。这是官方文档明说的「source of truth」机制。
#   - Secret（类型选 Secret，加密保存）：wrangler deploy 不会删，除非手动
#     `wrangler secret delete <key>`。
#
# 本项目的 ADMIN_TOKEN、CONFIG_ENC_KEY 必须在控制台以「Secret」类型添加，
# 否则每次重新部署都会消失（症状：站点回到「尚未完成配置」页）。
#
# keep_vars = true 是官方给的兜底开关：即使有人误把值存成了普通变量，
# deploy 时也会保留 dashboard 上的变量、而不是覆盖掉。它只影响普通变量，
# 对 Secret 无副作用，所以这里默认打开。
keep_vars = true

# 关掉 workers.dev 的全部公网入口（国内访问 workers.dev 普遍不稳定）：
#   - preview_urls = false：不再给每个部署版本发 <版本号>-qq-bot-cf.<子域>.workers.dev 临时预览链接
#   - workers_dev = false：连主地址 qq-bot-cf.<你的子域>.workers.dev 也一并禁用
# 两项都关掉之后，访问后台/首页只能走自定义域名（绑定方法见 README「绑定自定义域名」）；
# 部署本身不受影响，机器人走 WebSocket 出站连接 QQ 网关，不需要任何公网入站域名。
# 想临时恢复 workers.dev 访问：在 Cloudflare 控制台 → 该 Worker → Settings →
# Domains & Routes 里手动打开 workers.dev 开关（下次 deploy 会被配置再次关掉）。
preview_urls = false
workers_dev = false

# 不需要 cron 触发器。
#
# 早期靠每分钟 cron 做保活看门狗（WebSocket 掉线要立刻拉起），所以曾经是
# crons = ["* * * * *"]，每天固定 1,440 次 Worker + DO 请求。
#
# 现在两件事都改由 Durable Object 自己驱动：
#   - 定时提醒：新提醒入库时 setAlarm 到点，精确到秒
#   - WS 模式自检：ScheduleNextAlarm 保底 60 秒一次（断线/心跳超时/配额恢复）
#   - 部署后新版本 DO：构造函数里检查并补排 alarm
#   - 会话清理：构造函数里「距上次超过 24 小时」才扫一次
# 因此 cron 已无职责，删掉可省下每天 1,440 次请求。
#
# 想临时恢复巡检，取消下面这段的注释即可。
# [triggers]
# crons = ["0 */6 * * *"]

[durable_objects]
bindings = [
  { name = "QQ_BOT", class_name = "QQBotDO" },
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "CHAT", class_name = "ChatDO" },
  { name = "WORK", class_name = "WorkDO" },
  { name = "AIDO", class_name = "AiDO" }
]

# Workers AI 绑定：内置 TTS（MeloTTS）用它合成语音，不需要额外 API Key。
# 免费额度每天 10,000 neurons，MeloTTS 按音频分钟计费（约 $0.0002/分钟），日常够用。
[ai]
binding = "AI"

# Durable Object 的类迁移，保持原样即可；已有项目不要改动 tag
[[migrations]]
tag = "v1"
new_sqlite_classes = ["QQBotDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AIDOWorker"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["WorkspaceDO"]

[[migrations]]
tag = "v5"
renamed_classes = [{ from = "AIDOWorker", to = "ChatDO" }]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["ToolDO"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["AiDO"]

[[migrations]]
tag = "v8"
renamed_classes = [{ from = "WorkspaceDO", to = "WorkDO" }]
deleted_classes = ["ToolDO"]
